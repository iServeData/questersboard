[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "questersboard"
dynamic = ["version"]
description = "QuestersBoard: Discord-connected WoW character roster, event scheduler and moderated chronicle for a Discord gaming community"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.4,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0.30,<2.2",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "cryptography>=43",
  "python-dateutil>=2.9,<5",
  "pillow>=10",
  "markdown-it-py>=3,<5",
  "bleach>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
questersboard-web = "questersboard.web.app:main"
questersboard-bot = "questersboard.bot.client:main"
questersboard-worker = "questersboard.worker:main"
questersboard-admin = "questersboard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "questersboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
questersboard = ["web/templates/*.html", "web/templates/**/*.html", "web/static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "catalog/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
