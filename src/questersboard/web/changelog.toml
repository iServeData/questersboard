[[release.change]]
area = "Events"
kind = "new"
text = "Every member can publish events. Newer members send their drafts to moderators first."
[[release.change]]
area = "Voice"
kind = "new"
text = "Guest voice links, and hosts can remove or ban someone from an event's voice channel."
[[release.change]]
area = "Site"
kind = "new"
