text = "Event posts in Discord show faction colour, difficulty, levels, objective, cover art, host and a chat thread."
[[release.change]]
area = "Events"
kind = "improved"
text = "Attendees are only asked to reconfirm when a change affects their character."

[[release]]
date = "2026-11-03"
title = "Feedback batch"
[[release.change]]
area = "Events"
kind = "new"
text = "Per-attendee stories, co-hosts by username, role fill and group sizes."
[[release.change]]
area = "Events"
kind = "new"
text = "Classic editions and RP-PvP realms."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Race and class lists filter each other and work well on iPhone and iPad."

[[release]]
date = "2026-11-02"
title = "First release"
[[release.change]]
