# What's new, as members see it at <member path>/changelog. Newest first is not required: releases
# are sorted by date. Keep the wording plain and about what people can do; no internal details.
#
# [[release]]  date = "YYYY-MM-DD", title = short headline
#   [[release.change]]  area = one of AREAS below, kind = "new" | "improved" | "fixed", text = one sentence

[[release]]
date = "2026-11-13"
title = "Solo adventures, and characters that stay current from Blizzard"
[[release.change]]
area = "Chronicle"
kind = "new"
text = "Write a solo adventure: tell the story of something you did on your own, about one of your characters. It's reviewed like any other story and listed as Solo, below the group stories."
[[release.change]]
area = "Chronicle"
kind = "new"
text = "Join me next time on solo stories: readers can ask to come along, and the author can plan a group event from the story in one step. Everyone who asked gets the link."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Continue with Battle.net works in Chrome, Edge and Opera again."
[[release.change]]
area = "Voice"
kind = "improved"
text = "In event voice channels everyone with access can now also post links with previews and use the bot's commands, such as /voice invite."
[[release.change]]
area = "Voice"
kind = "fixed"
text = "Starting an event no longer sometimes opens several copies of its voice channel; any extra copies are removed."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Archiving a character that took part in a finished event works again."
[[release.change]]
area = "Events"
kind = "improved"
text = "QuestersBoard commands typed in the wrong channel now tell you which channel to use."
[[release.change]]
area = "Events"
kind = "new"
text = "Each event page has Add to calendar: download that one event for Apple or Outlook, open it in Google Calendar, or subscribe to all guild events or only yours."
[[release.change]]
area = "Events"
kind = "improved"
text = "Event chat threads in Discord can be private: everyone still sees the event, and the chat is for the people who join, go tentative or are on the waitlist, and the hosts."
[[release.change]]
area = "Characters"
kind = "new"
text = "Your characters are refreshed from Blizzard every few hours with the same details and sharing you chose, so gear, talents and professions stay current without pressing anything."
[[release.change]]
area = "Characters"
kind = "improved"
text = "A character Blizzard no longer has (renamed, moved or deleted) is shown as you entered it until you sync with Battle.net again."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Refresh from Blizzard and Refresh all from Blizzard now always ask Blizzard again, instead of showing what was read in the last few hours."

[[release]]
date = "2026-11-11"
title = "One account menu, a simpler My characters, recipe and role icons and a new footer"
[[release.change]]
area = "Events"
kind = "new"
text = "Event posts and event pages show a shield, a healing cross or crossed swords next to Tank, Healer and Damage."
[[release.change]]
area = "Site"
kind = "new"
text = "A menu row under the main menu opens Quests, Characters, Chronicle and Help, so every page is one or two taps away."
[[release.change]]
area = "Site"
kind = "new"
text = "One menu with your name at the top of every member page shows your Discord login and Battle.net together, with Sync now, Disconnect and Log out."
[[release.change]]
area = "Characters"
kind = "new"
text = "Connecting Battle.net is one login per region that finds your characters in every game version, then lets you add them in one go with one sharing choice."
[[release.change]]
area = "Characters"
kind = "improved"
text = "My characters shows your list and the selected character side by side, with Refresh from Blizzard by the name and the rest under the ⋯ button."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Who can see what saves as you click, with one control for all sections, and says why when a character needs verifying first."
[[release.change]]
area = "Guild"
kind = "improved"
text = "Roster tables keep their headings and filters in view while you scroll, and every column can be sorted."
[[release.change]]
area = "Guild"
kind = "improved"
text = "On phones, filters fold into one Filter and sort button."
[[release.change]]
area = "Characters"
kind = "new"
text = "Known recipes show what they make, with its icon and a tooltip like gear, where Blizzard links one. Press Refresh from Blizzard to fill them in."
[[release.change]]
area = "Site"
kind = "new"
text = "A footer on every page with the current version and this changelog."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Gear shows Item level in full instead of ilvl."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Race outlines now appear when a character has no picture from Blizzard yet."

