# What's new, as members see it at <member path>/changelog. Newest first is not required: releases
# are sorted by date. Keep the wording plain and about what people can do; no internal details.
#
# [[release]]  date = "YYYY-MM-DD", title = short headline
#   [[release.change]]  area = one of AREAS below, kind = "new" | "improved" | "fixed", text = one sentence

[[release]]
date = "2026-11-20"
title = "The Adventure Board and Profession help"
[[release.change]]
area = "Guild"
kind = "improved"
text = "You can edit your post's details, and what you ask for on a craft offer, from the post's page; its Discord card updates too."
[[release.change]]
area = "Events"
kind = "new"
text = "The Adventure Board, under Quests, is for goals before there's an event: say what you need help with, offer help or look for company, and turn it into an event when enough people are in."
[[release.change]]
area = "Guild"
kind = "new"
text = "Profession help, under Characters, lets you ask for a craft, offer recipes your characters know from Blizzard, look for a recipe or find company to farm."
[[release.change]]
area = "Events"
kind = "improved"
text = "Event moderators who aren't hosting an event now see its panel labelled Moderator tools instead of Host tools."
[[release.change]]
area = "Events"
kind = "improved"
text = "The new-post forms on both boards open from buttons at the top of the page. If a post can't be sent, the form stays open with everything you typed, and the field to fix is outlined in red."
[[release.change]]
area = "Guild"
kind = "improved"
text = "Offer a craft asks for the character first, then lists only the items that character can craft."
[[release.change]]
area = "Guild"
kind = "new"
text = "Offer a craft can say what you ask for: bring your materials, a fee in gold, silver and copper like the auction house, or both. The fee shows on the post and its Discord card."
[[release.change]]
area = "Events"
kind = "improved"
text = "Board posts show the poster's character picture to people who can see that character's portrait, and the race outline to everyone else."
[[release.change]]
area = "Guild"
kind = "improved"
text = "Craft posts, and their cards in Discord, now show the item's details from Blizzard and the reagents it needs. Point at or tap the item's icon on the site for the full tooltip. Press Refresh from Blizzard on a character page to add reagents to recipes imported earlier (recipes with an open craft post are looked up first); that character's open craft cards in Discord update too."

[[release]]
date = "2026-11-15"
title = "A new picture every day, and who's in voice on the WoW page"
[[release.change]]
area = "Site"
kind = "new"
text = "Every page has a short WoW banner at the top and a picture above the footer, and the pair changes every day at midnight."
[[release.change]]
area = "Events"
kind = "new"
text = "The WoW page's Community status card shows our open voice channels with how many people are in each, since when, and a Join voice link."

[[release]]
date = "2026-11-14"
title = "Item cards in Who can craft, new guest links for hosts, and new error pages"
[[release.change]]
area = "Guild"
kind = "improved"
text = "Who can craft shows each matching item above the table with its icon, tooltip and how many characters can craft it, and every result lists the item with its icon."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Item and talent tooltips use Blizzard's details only, with no links to other sites."
[[release.change]]
area = "Site"
kind = "improved"
text = "Missing pages, \"Too many requests\" and other errors now show a proper QuestersBoard page with a way back to the board."
[[release.change]]
area = "Events"
kind = "new"
text = "Hosts can make a new guest voice link with /voice invite new:True, which stops every old guest link for the event."
[[release.change]]
area = "Events"
kind = "improved"
text = "The /voice commands also work in the event's own voice chat, so hosts can pick the right event when two are running."
[[release.change]]
area = "Site"
kind = "improved"
text = "While QuestersBoard is restarting or down, you see a QuestersBoard page saying it'll be back shortly, instead of a blank server error."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Looking at several characters in a row no longer shows question marks for talent icons or a \"Too many requests\" page."
[[release.change]]
area = "Chronicle"
kind = "fixed"
text = "Uploading a screenshot or using the other buttons beside your story no longer clears the text you've typed."
[[release.change]]
area = "Chronicle"
kind = "improved"
text = "Each screenshot now says whether it's on the public page yet, and the editor explains how to clear it."
[[release.change]]
area = "Chronicle"
kind = "fixed"
text = "Line breaks and bullet points in stories show on the public page the way you typed them."

[[release]]
date = "2026-11-13"
title = "Solo adventures, and characters that stay current from Blizzard"
[[release.change]]
area = "Events"
kind = "new"
text = "Hosts and co-hosts get a short direct message when their event starts with the voice, chat and guest links, how to end it, and how to remove someone from voice. Admins get one when they press Support Admin."
[[release.change]]
area = "Chronicle"
kind = "new"
text = "Write a solo adventure: tell the story of something you did on your own, about one of your characters. It's reviewed like any other story and listed as Solo, below the group stories."
[[release.change]]
area = "Chronicle"
kind = "new"
text = "Join me next time on solo stories: readers can ask to come along, and the author can plan a group event from the story in one step. Everyone who asked gets the link."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Continue with Battle.net works in Chrome, Edge and Opera again."
[[release.change]]
area = "Voice"
kind = "improved"
text = "In event voice channels everyone with access can now also post links with previews and use the bot's commands, such as /voice invite."
[[release.change]]
area = "Voice"
kind = "fixed"
text = "Starting an event no longer sometimes opens several copies of its voice channel; any extra copies are removed."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Archiving a character that took part in a finished event works again."
[[release.change]]
area = "Events"
kind = "improved"
text = "QuestersBoard commands typed in the wrong channel now tell you which channel to use."
[[release.change]]
area = "Events"
kind = "new"
text = "Each event page has Add to calendar: download that one event for Apple or Outlook, open it in Google Calendar, or subscribe to all guild events or only yours."
[[release.change]]
area = "Events"
kind = "improved"
text = "Event chat threads in Discord can be private: everyone still sees the event, and the chat is for the people who join, go tentative or are on the waitlist, and the hosts."
[[release.change]]
area = "Characters"
kind = "new"
text = "Your characters are refreshed from Blizzard every few hours with the same details and sharing you chose, so gear, talents and professions stay current without pressing anything."
[[release.change]]
area = "Characters"
kind = "improved"
text = "A character Blizzard no longer has (renamed, moved or deleted) is shown as you entered it until you sync with Battle.net again."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Refresh from Blizzard and Refresh all from Blizzard now always ask Blizzard again, instead of showing what was read in the last few hours."

[[release]]
date = "2026-11-11"
title = "One account menu, a simpler My characters, recipe and role icons and a new footer"
[[release.change]]
area = "Events"
kind = "new"
text = "Event posts and event pages show a shield, a healing cross or crossed swords next to Tank, Healer and Damage."
[[release.change]]
area = "Site"
kind = "new"
text = "A menu row under the main menu opens Quests, Characters, Chronicle and Help, so every page is one or two taps away."
[[release.change]]
area = "Site"
kind = "new"
text = "One menu with your name at the top of every member page shows your Discord login and Battle.net together, with Sync now, Disconnect and Log out."
[[release.change]]
area = "Characters"
kind = "new"
text = "Connecting Battle.net is one login per region that finds your characters in every game version, then lets you add them in one go with one sharing choice."
[[release.change]]
area = "Characters"
kind = "improved"
text = "My characters shows your list and the selected character side by side, with Refresh from Blizzard by the name and the rest under the ⋯ button."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Who can see what saves as you click, with one control for all sections, and says why when a character needs verifying first."
[[release.change]]
area = "Guild"
kind = "improved"
text = "Roster tables keep their headings and filters in view while you scroll, and every column can be sorted."
[[release.change]]
area = "Guild"
kind = "improved"
text = "On phones, filters fold into one Filter and sort button."
[[release.change]]
area = "Characters"
kind = "new"
text = "Known recipes show what they make, with its icon and a tooltip like gear, where Blizzard links one. Press Refresh from Blizzard to fill them in."
[[release.change]]
area = "Site"
kind = "new"
text = "A footer on every page with the current version and this changelog."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Gear shows Item level in full instead of ilvl."
[[release.change]]
area = "Characters"
kind = "fixed"
text = "Race outlines now appear when a character has no picture from Blizzard yet."

[[release]]
date = "2026-11-10"
title = "Known recipes and Who can craft"
[[release.change]]
area = "Characters"
kind = "new"
text = "Each profession lists the recipes the character knows."
[[release.change]]
area = "Guild"
kind = "new"
text = "Who can craft: search the guild roster and Shared characters for a recipe to see who knows it."
[[release.change]]
area = "Characters"
kind = "new"
text = "Characters without a picture from Blizzard show an outline of their race."
[[release.change]]
area = "Characters"
kind = "improved"
text = "Talent trees are centred, and the Top button stays out of the way of Add a character."

[[release]]
date = "2026-11-09"
title = "Character pages from Blizzard"
[[release.change]]
area = "Characters"
kind = "new"
text = "Import gear, talents, professions, stats, portrait and hunter pets from Blizzard, choosing who can see each part."
[[release.change]]
area = "Characters"
kind = "new"
text = "Gear and talent icons with tooltips, full talent trees, and pets on a stand."
[[release.change]]
area = "Characters"
kind = "new"
text = "Refresh one character or all of them from Blizzard, keeping the same sharing."
[[release.change]]
area = "Guild"
kind = "new"
text = "Guild roster and Shared characters pages, with filters by class, role, spec, profession and level."
[[release.change]]
area = "Characters"
kind = "new"
text = "Sync from Battle.net marks your characters as verified and lets you add the rest in one go."

[[release]]
date = "2026-11-08"
title = "Signups and voice"
[[release.change]]
area = "Events"
kind = "improved"
text = "Tentative signups can switch to confirmed with I'm in on the event page or Join again in Discord."
[[release.change]]
area = "Voice"
kind = "fixed"
text = "Event voice channels are created reliably and stay private to the event."

[[release]]
date = "2026-11-07"
