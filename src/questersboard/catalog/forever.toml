# WoW: Forever race/class seed. Source: Blizzard, "Create the Hero You Want to Be in
# World of Warcraft: Forever" (https://worldofwarcraft.blizzard.com/en-us/news/24304075)
# and "Return to Azeroth in World of Warcraft: Forever"
# (https://news.blizzard.com/en-us/article/24315643/return-to-azeroth-in-world-of-warcraft-forever).
# Recorded 2026-10-31; Alliance Skyborne label corrected to High Order 2026-11-01. source = "seed", verification = "unverified" until Blizzard publishes
# a Forever static namespace and `questersboard-admin blizzard import-reference forever` replaces it.
# Skyborne requires the Heroic Pack or higher; class list depends on faction.

source_url = "https://worldofwarcraft.blizzard.com/en-us/news/24304075"
# "Where" suggestions: Forever returns to the original Azeroth; the list is a starter (unverified).
locations = ["locations_vanilla"]

classes = ["druid", "hunter", "mage", "paladin", "priest", "rogue", "shaman", "warlock", "warrior"]

[class_labels]
druid = "Druid"
hunter = "Hunter"
mage = "Mage"
paladin = "Paladin"
priest = "Priest"
rogue = "Rogue"
shaman = "Shaman"
warlock = "Warlock"
warrior = "Warrior"

[races.horde]
orc = { label = "Orc", classes = ["warrior", "hunter", "rogue", "shaman", "warlock", "mage"] }
tauren = { label = "Tauren", classes = ["warrior", "hunter", "shaman", "druid"] }
troll = { label = "Troll", classes = ["warrior", "hunter", "rogue", "priest", "shaman", "mage", "warlock"] }
undead = { label = "Undead", classes = ["warrior", "rogue", "priest", "mage", "warlock", "paladin"] }
skyborne = { label = "Skyborne (Windshaper)", classes = ["warrior", "hunter", "rogue", "druid", "shaman"] }

[races.alliance]
human = { label = "Human", classes = ["warrior", "paladin", "rogue", "priest", "mage", "warlock", "hunter"] }
dwarf = { label = "Dwarf", classes = ["warrior", "paladin", "hunter", "rogue", "priest", "shaman"] }
night_elf = { label = "Night Elf", classes = ["warrior", "hunter", "rogue", "priest", "druid"] }
gnome = { label = "Gnome", classes = ["warrior", "rogue", "mage", "warlock", "priest"] }
skyborne = { label = "Skyborne (High Order)", classes = ["warrior", "hunter", "rogue", "druid", "mage"] }
