# /etc/wowquester/config.toml   (owner root:wowquester, mode 0640)
#
# QuestersBoard settings. NO SECRETS in this file. Tokens, client secrets and
# database passwords are systemd credentials (see docs/configuration.md).
# Discord IDs MUST be quoted strings.
#
# Reload behaviour: sections marked [live] are re-read about every 30 seconds
# when the file changes AND the whole file still validates. Every other
# section needs `sudo systemctl restart wowquester-*.service`.
# All three services (web, bot, worker) read this same file.

[community]                                   # restart
name = "Example Community"
guild_id = ""                                 # Discord server (guild) ID
default_timezone = "America/Los_Angeles"      # IANA name
# Time zones listed first in the time zone pickers (the full IANA list follows). The community default
# is always first. Optional.
common_timezones = ["America/Los_Angeles", "America/Denver", "America/Chicago", "America/New_York",
                    "Europe/London", "Europe/Berlin", "Australia/Sydney"]
public_base_url = "https://community.example.org"
# Optional Discord role every member must hold to use QuestersBoard at all.
# Empty = any member of the guild.
member_role_ids = []

[discord]                                     # restart
application_id = ""
event_channel_id = ""                         # where event posts live
review_channel_id = ""                        # optional: chronicle reviewers get a short notice here (no story text)
publish_request_channel_id = ""               # optional: staff channel told when a member sends a draft for
                                              # publishing; empty uses review_channel_id
allowed_command_channel_ids = []              # slash commands only work here (plus DMs if enabled)
dm_enabled = true                             # members may use the bot in DMs; same permission checks apply
notify_dm_on_material_change = true           # DM confirmed participants when time/location changes or event is cancelled
reconfirm_window_hours = 24

[publishing]                                  # live
open_to_all = true                            # every member may publish events (the event_creator role always may)
probation_days = 7                            # members newer to the server than this send drafts to moderators
                                              # for approval instead; 0 = no probation

[roles]                                       # [live] Discord role IDs per capability
event_creator = []          # create and publish events
event_moderator = []        # start/end/cancel/edit ANY event; manage any signups
exclusive_designator = []   # mark an event "exclusive"
chronicle_editor = []       # edit any chronicle draft
chronicle_reviewer = []     # approve / reject / request changes / unpublish
trusted_author = []         # self-publish own chronicle entries (still audited, still consent-checked)
admin = []                  # catalog and configuration admin in the web UI

[scheduling]                                  # [live]
max_simultaneous_wow_events = 1               # positive integer. 1 = no two WoW events may overlap.
min_duration_minutes = 15
max_duration_hours = 12
max_days_ahead = 180
late_join_default = false
overrun_grace_minutes = 30                    # how long "in progress" may run past the planned end before a reminder
reschedule_requires_reconfirm = true
end_change_notice_only_minutes = 0            # 0 = any time change asks for reconfirm; e.g. 30 = moving only the end by up to 30 min just sends a notice
max_recurrence_occurrences = 26

[signups]                                     # [live]
default_policy = "open"                       # open | approval
allow_tentative = true
max_custom_roles = 10

# Largest group per activity type. The participant limit can't go above it, and an event's
# role "How many" numbers can't add up to more than the limit. Types not listed cap at 80.
[signups.party_size_max]
quest = 5
dungeon = 5
arena = 5
raid = 40
battleground = 40

[reminders]                                   # [live]
offsets_minutes = [60, 15]

[chronicle]                                   # [live]
public_path = "/wow/chronicle"
public_after_approval = true
# Neutral description for opted-out participants:
#   "role"        -> "a healer"
#   "role_class"  -> "a druid healer"   (more identifying; off by default)
neutral_description_style = "role"
max_body_chars = 8000
# Search results and link previews (Discord, iMessage, social sites) for the public Chronicle pages.
# A story uses its own summary and first approved screenshot; the archive and pages without a
# screenshot use these. social_image: a / path on this site or an https:// URL (empty = no image).
description = "Stories from community WoW events"
social_image = ""                              # e.g. "/assets/images/social/og_wow.jpg"
social_image_alt = ""
social_image_width = 0                         # pixels; 0 = not stated
social_image_height = 0
sitemap = true                                 # serves PUBLIC_PATH/sitemap.xml (archive + published stories)

[uploads]                                     # restart
storage_dir = "/var/lib/wowquester/uploads"
max_bytes = 5_000_000
allowed_types = ["image/png", "image/jpeg", "image/webp"]
max_per_entry = 6

[event_posts]                                 # [live] the Discord event post
# Accent bar colour by the event's faction ("any" = open to both).
faction_colors = { horde = "#C41E3A", alliance = "#1F6FD8", any = "#C9A227" }
# Cover art when an organizer doesn't upload one: a file in <[uploads] storage_dir>/covers.
# Install it with: sudo -u wowquester wowquester-admin default-cover /path/to/art.png
# A missing file is skipped (the post just has no image).
default_cover = "default_cover.webp"
activity_covers = {}                          # optional per type, e.g. { raid = "raid_cover.webp" }
field_spacing = true                          # a blank line between the post's headings (Time, Duration, ...)

[event_threads]                               # restart. One Discord chat thread per event (off until approved)
enabled = false                               # needs Create Public Threads, Send Messages in Threads, Manage Threads
private = false                               # true = invite-only threads (Create Private Threads instead)
archive_after_hours = 24                      # lock and archive this long after the event ends
reminders_in_thread = true                    # also post the reminder (with open spots) in the thread
name_suffix = " · chat"

[voice]                                       # restart. One voice channel per running event (off until approved)
enabled = false                               # bot needs, on the category only: Manage Channels, Manage Permissions,
                                              # Move Members, View Channel, Connect, Speak, Video, Use Voice
                                              # Activity, Send Messages, Read Message History
category_id = ""                              # the Discord category the channels are created in
name_template = "{title}"                     # {title} and {id}; trimmed to 100 characters
user_limit = 0                                # 0 = no cap
empty_teardown_minutes = 5                    # empty this long after the scheduled end: channel removed
member_states = ["confirmed", "tentative"]    # signups that get access (hosts always do)
moderators_can_join = true                    # [roles] event_moderator roles can join without signing up
staff_role_ids = []                           # more server roles (e.g. admins) that can join every event voice
remove_on_leave = false                       # false: someone who leaves the event may stay if connected but
                                              # can't rejoin; true: they are disconnected straight away
protected_role_ids = []                       # roles hosts can't kick or ban (e.g. admins, officers); the server
                                              # owner, bots, staff_role_ids and [roles] admin are always protected
guest_invites = true                          # /voice invite: guest links for people outside the event
                                              # (the bot's role needs Create Invite to add guests to the server)
max_guests_per_invite = 5                     # people per guest link (1-25)
invite_dm = "off"                             # off | hosts | everyone: DM guest links when the event starts
guest_link_template = ""                      # "" = public_base_url + member_path + "/v/{code}";
                                              # a short domain, e.g. "https://short.example.org/v/{code}"

[ai]                                          # restart
enabled = false                               # explicit opt-in
provider = "openai_compatible"                # openai_compatible | none
base_url = "https://api.openai.com/v1"
model = ""
timeout_seconds = 30
max_output_tokens = 900
credential = "ai-api-key"

[feeds]                                       # restart
items = 20
cache_seconds = 300

[calendar]                                    # restart
public_enabled = true
horizon_days = 90

[web]                                         # restart
bind = "fd:3"                                 # fd:3 = socket from wowquester-web.socket; or "127.0.0.1:8740" for local dev
member_path = "/wow/quester"
session_hours = 72
cookie_secure = true
assets_base = "/assets"                       # the existing site's CSS/fonts

[branding]                                    # restart. Page chrome only; all values site-specific.
site_name = "Example Community"
home_url = "/"
game_page_url = "/wow/"                       # the site's WoW page (back link)
stylesheet = "/assets/css/styles.css"         # reuse the host site's stylesheet; empty = bundled fallback CSS
body_class = "theme-wow"
discord_invite_url = ""                       # optional "Join the Discord" link
nav = [ { label = "Home", url = "/" }, { label = "WoW", url = "/wow/" } ]

[status]                                      # [live] optional; these are the defaults. Feeds status.json for the site's cards
starting_soon_minutes = 15                    # "Starting soon" this long before the start; "Live" only after an organiser launches
heartbeat_seconds = 30                        # how often the bot and worker check in
stale_after_seconds = 120                     # no check-in for this long: the card stops showing them as running
voice_stale_after_seconds = 180               # voice head counts older than this are hidden
cache_seconds = 15                            # Cache-Control max-age for status.json

[retention]                                   # restart
outbox_done_days = 14                         # finished background jobs
api_cache_days = 30
audit_days = 400                              # pruned by `wowquester-admin prune` (admin role), never by services
withdrawn_signup_days = 365                   # withdrawn/rejected signups of past events
session_days_after_expiry = 1

[legal]                                       # restart. Shown on /privacy and /terms; optional
operator = ""                                 # who runs this install; empty = the [community] name
contact = "Message an organiser in the community Discord server."
effective_date = ""                           # YYYY-MM-DD shown as "Last updated"; empty = hidden
backup_keep_days = 30                         # keep in step with WOWQUESTER_BACKUP_KEEP_DAYS

[rate_limits]                                 # [live]
web_requests_per_minute = 120
actions_per_minute = 30

[database]                                    # restart
# No password here. App/worker passwords come from credentials db-app-password / db-worker-password.
app_url = "postgresql+psycopg://wowquester_app@127.0.0.1:5432/wowquester"
worker_url = "postgresql+psycopg://wowquester_worker@127.0.0.1:5432/wowquester"
admin_url = "postgresql+psycopg://wowquester_admin@127.0.0.1:5432/wowquester"   # migrations + admin CLI only (credential db-admin-password)
pool_size = 5

[blizzard]                                    # restart
enabled = false                               # turn on after credentials are installed
oauth_base = "https://oauth.battle.net"
api_host_template = "https://{region}.api.blizzard.com"
timeout_seconds = 10
max_retries = 3
requests_per_second = 20                      # Blizzard's published ceiling is higher; stay well under
cache_hours_static = 168
cache_hours_profile = 6
battlenet_link_enabled = false                # optional ownership verification (wow.profile scope)
battlenet_import_minutes = 60                 # after a Battle.net login, how long the "Add these characters" list stays usable
data_ttl_days = 30                            # Blizzard checks not refreshed for this long are cleared (API terms: 30 max)
battlenet_profile_lookups = 25                # per login: max character-profile reads to fill in a missing ruleset (0 = none)

# ---------------------------------------------------------------------------
# Game editions. Each QuestersBoard event and character belongs to exactly one.
# Namespaces use {region}. Leave a namespace empty when Blizzard has not
# published one: the feature then shows "not available" instead of guessing.
# api_status values: verified | unverified | unsupported
# ---------------------------------------------------------------------------

[[editions]]
key = "forever"
name = "WoW: Forever"
uses_realms = false                           # Forever is realmless; rulesets replace realms
rulesets = ["normal", "pvp", "rp", "rp_pvp"]    # Hardcore opens later: add "hardcore" then
ruleset_labels = { rp_pvp = "RP-PvP" }        # optional; normal/pvp/rp/rp_pvp/hardcore have built-in labels
default_ruleset = "pvp"
regions = ["us"]
default_region = "us"
factions = ["horde", "alliance"]
default_faction = "horde"
max_level = 60
difficulties = ["Normal"]      # optional; the event form's Difficulty list (default: Normal only)
catalog = "forever"                           # packaged race/class seed (src/wowquester/catalog/forever.toml)
# Forever namespaces aren't documented by Blizzard; these come from community testing after
# launch (Nov 2026) and may change. Check with: wowquester-admin blizzard probe forever --region us
# The static namespace can be pinned to a game version, e.g. "static-1.60.1_70399-forever-{region}".
static_namespace = "static-forever-{region}"
dynamic_namespace = "dynamic-forever-{region}"
profile_namespace = "profile-forever-{region}"
# Forever characters are realmless: the API addresses them as {name}-{surname}.
ruleset_realm_slugs = {}
# Blizzard's ruleset IDs (dynamic namespace /data/wow/ruleset/index), used by Battle.net sync.
ruleset_api_ids = { pvp = 1, normal = 2, rp = 3, rp_pvp = 15 }
# ownership = Battle.net login lists your characters; character = "Check with Blizzard"
# (works in US; EU character pages were reported as 404 after launch).
api_status = { reference = "unsupported", character = "unverified", quests = "unsupported", locations = "unsupported", ownership = "unverified" }

[[editions]]
key = "retail"
name = "WoW (Retail)"
uses_realms = true
rulesets = []
default_ruleset = ""
regions = ["us", "eu"]
default_region = "us"
factions = ["horde", "alliance"]
default_faction = "horde"
max_level = 90
difficulties = ["Normal", "Heroic", "Mythic", "Mythic+", "Raid Finder"]
catalog = "retail"                            # packaged race/class seed; dungeons and raids come from a Blizzard import (wowquester-admin blizzard import-reference retail)
static_namespace = "static-{region}"
dynamic_namespace = "dynamic-{region}"
profile_namespace = "profile-{region}"
ruleset_realm_slugs = {}
api_status = { reference = "unverified", character = "unverified", quests = "unverified", locations = "unverified", ownership = "unverified" }

# Classic editions use realms. Namespaces from Blizzard's API forums / community docs (unverified here):
# Era/Hardcore/Season of Discovery = classic1x, TBC Anniversary = classicann, progression (Mists) = classic.
[[editions]]
key = "classic_era"
name = "WoW Classic (Era, Hardcore, Season of Discovery)"
uses_realms = true
rulesets = []
default_ruleset = ""
regions = ["us", "eu"]
default_region = "us"
factions = ["horde", "alliance"]
default_faction = "horde"
max_level = 60
difficulties = ["Normal"]
catalog = "classic_era"
static_namespace = "static-classic1x-{region}"
dynamic_namespace = "dynamic-classic1x-{region}"
profile_namespace = "profile-classic1x-{region}"
ruleset_realm_slugs = {}
api_status = { reference = "unverified", character = "unverified", quests = "unsupported", locations = "unsupported", ownership = "unverified" }

[[editions]]
key = "classic_anniversary"
name = "WoW Classic: Burning Crusade Anniversary"
uses_realms = true
rulesets = []
default_ruleset = ""
regions = ["us", "eu"]
default_region = "us"
factions = ["horde", "alliance"]
default_faction = "horde"
max_level = 70
difficulties = ["Normal", "Heroic"]
catalog = "classic_tbc"
static_namespace = "static-classicann-{region}"
dynamic_namespace = "dynamic-classicann-{region}"
profile_namespace = "profile-classicann-{region}"
ruleset_realm_slugs = {}
api_status = { reference = "unverified", character = "unverified", quests = "unsupported", locations = "unsupported", ownership = "unverified" }

[[editions]]
key = "mists_classic"
name = "WoW Classic: Mists of Pandaria"
uses_realms = true
rulesets = []
default_ruleset = ""
regions = ["us", "eu"]
default_region = "us"
factions = ["horde", "alliance"]
default_faction = "horde"
max_level = 90
difficulties = ["Normal", "Heroic", "Challenge Mode", "Raid Finder"]
catalog = "classic_mists"
static_namespace = "static-classic-{region}"
dynamic_namespace = "dynamic-classic-{region}"
profile_namespace = "profile-classic-{region}"
ruleset_realm_slugs = {}
api_status = { reference = "unverified", character = "unverified", quests = "unsupported", locations = "unsupported", ownership = "unverified" }

# Group-role presets offered to event creators: the three in-game group roles.
# Hosts can still add their own role (for example "Guide" for a levelling run) as a custom role.
[[role_presets]]
key = "tank"
label = "Tank"
[[role_presets]]
key = "healer"
label = "Healer"
[[role_presets]]
key = "damage"
label = "Damage"

# Activity catalog used for recommendations. Durations and sizes are the
# organizers' own guidance, not game mechanics.
[[activities]]
key = "questing"
type = "quest"
label = "Questing group"
min_minutes = 45
min_size = 2
max_size = 5
tags = ["pve", "questing", "learning", "social"]
[[activities]]
key = "dungeon"
type = "dungeon"
label = "Dungeon run"
min_minutes = 60
min_size = 5
max_size = 5
roles = { tank = 1, healer = 1, damage = 3 }
tags = ["pve", "dungeon"]
[[activities]]
key = "rp_meet"
type = "rp"
label = "RP gathering"
min_minutes = 30
min_size = 2
max_size = 40
tags = ["rp", "social"]
[[activities]]
key = "world_pvp"
type = "world_pvp"
label = "World PvP patrol"
min_minutes = 45
min_size = 3
max_size = 40
tags = ["pvp"]
[[activities]]
key = "raid"
type = "raid"
label = "Raid night"
min_minutes = 120
min_size = 10
max_size = 40
roles = { tank = 2, healer = 3, damage = 15 }
tags = ["pve", "raid"]
