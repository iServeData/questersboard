# QuestersBoard locations. PROPOSED: include inside the existing site's `server { ... }` block for the
# community domain (both prototype and live servers), e.g.
#     include /etc/nginx/snippets/questersboard_location[s].conf;   # [s] glob: nginx -t passes if absent
# Nothing else in the server block changes. The static site keeps serving /wow/ and /assets/.

# Member pages, uploads, JSON for the WoW page schedule, calendars.
location ^~ /wow/quester/ {
    proxy_pass http://unix:/run/questersboard-web.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 12m;                        # >= [uploads] max_bytes; the app enforces the real limit
}

# Short guest voice links: /v/<code> (and short.example.org/v/<code> if the short domain redirects
# every path here) go to the guest page. Matches only 6-16 letters and digits from the code alphabet.
location ~ "^/v/([a-z2-9]{6,16})$" {
    return 302 /wow/quester/v/$1;
}

# Public chronicle: archive, stories, screenshots, feeds. Generated from approved projections only.
location ^~ /wow/chronicle/ {
    proxy_pass http://unix:/run/questersboard-web.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
    limit_except GET HEAD { deny all; }
}
