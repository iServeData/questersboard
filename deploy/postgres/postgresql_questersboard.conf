# /etc/postgresql/<ver>/main/conf.d/questersboard.conf  (proposed)
listen_addresses = 'localhost'          # never 0.0.0.0; port 5432 stays closed in the firewall
port = 5432
password_encryption = 'scram-sha-256'
ssl = off                               # loopback/socket only; enable if ever exposed (it must not be)
log_connections = on                    # PG 18: may also be set to 'receipt,authentication,authorization'
log_disconnections = on
log_statement = 'ddl'                   # all CREATE/ALTER/DROP, incl. role changes
                                        # (roles.sql turns this off for its own session so passwords aren't logged;
                                        #  change passwords with psql \password, which sends only a SCRAM hash)
log_line_prefix = '%m [%p] %q%u@%d %a '
log_lock_waits = on
idle_in_transaction_session_timeout = '60s'
shared_preload_libraries = ''           # pgaudit optional; not required
