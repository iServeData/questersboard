# /etc/postgresql/<ver>/main/pg_hba.conf  (proposed; owner postgres:postgres 0640)
# First match wins. No "trust" lines anywhere.
# TYPE   DATABASE     USER                 ADDRESS         METHOD
# postgres superuser: local Unix socket, OS-user peer check only. No password login.
local    all          postgres                             peer
# Reject postgres (and any role named root) over TCP, and root over the socket, outright.
host     all          postgres             0.0.0.0/0       reject
host     all          postgres             ::/0            reject
local    all          root                                 reject
host     all          root                 0.0.0.0/0       reject
host     all          root                 ::/0            reject
# WoWQuester roles: localhost / socket only, SCRAM passwords.
local    wowquester   wowquester_admin,wowquester_app,wowquester_worker,wowquester_readonly   scram-sha-256
host     wowquester   wowquester_admin,wowquester_app,wowquester_worker,wowquester_readonly   127.0.0.1/32   scram-sha-256
host     wowquester   wowquester_admin,wowquester_app,wowquester_worker,wowquester_readonly   ::1/128        scram-sha-256
# Restore drills only (deploy/backup/restore.sh): scratch database, admin role, localhost.
host     wowquester_restore_check   wowquester_admin   127.0.0.1/32   scram-sha-256
# Everything else is rejected. (`host` covers SSL and non-SSL; no `hostssl` lines while ssl = off,
# because PostgreSQL treats those as errors and may refuse to start.)
local    all          all                                  reject
host     all          all                  0.0.0.0/0       reject
host     all          all                  ::/0            reject
